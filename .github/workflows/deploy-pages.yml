name: Deploy to GitHub Pages (DEPRECATED — do not use)

# ─────────────────────────────────────────────────────────────────────────────
# DEPRECATED: STASH's production PWA host is Cloudflare Pages
# (see deploy-cloudflare-pages.yml + docs/cloudflare-pages-deploy.md).
# GitHub Pages put the app under /stash2026/ which fights the PWA's root
# scope, icons, and Add-to-Home-Screen behavior.
#
# This workflow is kept ONLY as a disabled reference: it no longer runs on
# push/PR (triggers removed) and its deploy job is hard-gated off with
# `if: false`. `pnpm build:public` now defaults to a ROOT-path bundle, so
# reviving GitHub Pages project hosting would additionally require setting
# the `PUBLIC_BASE_PATH` repo variable to `/<repo>`.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # DEPRECATED — manual dispatch only. No automatic triggers.
  workflow_dispatch:

# Don't let two deploys race; cancel the in-progress one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is sufficient for `actions/deploy-pages` —
# no extra secrets are required.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build public bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages project sites are served under /<repo>/. The build
      # script no longer defaults to that (Cloudflare Pages is root-path),
      # so revive the explicit override here if this flow is ever re-enabled.
      - name: Build public bundle
        env:
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
        run: pnpm build:public

      - name: Configure Pages
        run: |
          mkdir -p _site
          cp -R dist/public/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # HARD DISABLED — Cloudflare Pages is the production host now.
    if: false
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
