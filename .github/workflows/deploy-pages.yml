name: Deploy to GitHub Pages

# Builds the prerendered static bundle (`pnpm build:public`) and
# publishes it via the official `actions/deploy-pages` action.
#
# Triggered on every push to `master` (and any `arena/**` working
# branch) and on manual dispatch. On pull requests, only the build
# job runs — the actual deploy step is skipped, because GitHub Pages
# can't accept a deployment from a PR head and the step would 404.
#
# The first deployment requires Settings → Pages → Source = "GitHub
# Actions" in the repo UI; once that is set, this workflow runs
# hands-off. No secrets are required.
#
# The deployed URL is
#   https://<owner>.github.io/<repo>/
# with a project-page base of `/<repo>`. Override `PUBLIC_BASE_PATH`
# via a repo variable for root-hosted user/org sites or custom
# domains.

on:
  push:
    branches:
      - master
      - main
      - arena/**
  pull_request:
    branches:
      - master
      - main
      - arena/**
  workflow_dispatch:

# Don't let two deploys race; cancel the in-progress one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is sufficient for `actions/deploy-pages` —
# no extra secrets are required.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build public bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUBLIC_BASE_PATH defaults to "/<repo>" so the project page works
      # out of the box at https://<owner>.github.io/<repo>/. Set this
      # to "" (empty) in a repo variable to deploy to a user/org site
      # at https://<owner>.github.io/, or to your custom-domain path
      # (e.g. "/app") if you point a CNAME at GitHub Pages.
      - name: Build public bundle
        env:
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
        run: pnpm build:public

      - name: Configure Pages
        run: |
          mkdir -p _site
          cp -R dist/public/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy on direct pushes to a release branch. Pull requests
    # build the bundle (so reviewers can see the build is green) but
    # do NOT trigger the actual deploy — GitHub Pages can't accept a
    # deployment from a fork / PR head, and the deploy step would
    # fail with 404 "Failed to create deployment".
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
