name: Build Windows App

# Builds the STASH Windows desktop app (Tauri) and produces the .exe plus an
# NSIS installer. Triggered by pushing to the main release branches OR by
# pressing "Run workflow" in the Actions tab.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build STASH Windows app
    runs-on: windows-latest
    timeout-minutes: 60

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-${{ runner.os }}-

      - name: Install dependencies (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared STASH web application (prerender)
        run: pnpm build:web

      - name: Build native web bundle
        run: pnpm build:native-web

      - name: Build STASH with Tauri (includes installer bundler)
        run: pnpm tauri:build

      - name: Collect build artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _artifacts | Out-Null
          if (Test-Path "src-tauri/target/release/stash.exe") {
            Copy-Item "src-tauri/target/release/stash.exe" "_artifacts/STASH.exe"
          }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "_artifacts/STASH-Setup.exe"
          }
          Get-ChildItem "_artifacts" | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: STASH-Windows
          path: _artifacts/*.exe
          if-no-files-found: error
