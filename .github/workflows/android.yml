name: Build Android APK

# Builds a debug/test APK for sideloading. Triggered by pushing to the main
# release branches OR by pressing "Run workflow" in the Actions tab.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build STASH debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared STASH web application (prerender)
        run: pnpm build:web

      - name: Build native web bundle
        run: pnpm build:native-web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Compile debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Copy APK to a clean name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STASH-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STASH-Android-Debug
          path: STASH-debug.apk
          if-no-files-found: error
