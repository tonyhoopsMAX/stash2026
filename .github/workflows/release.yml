name: Release

# OPTIONAL release pipeline. When a version tag such as v1.0.0 is pushed,
# GitHub builds the Android APK and the Windows app, then attaches them to a
# release for that tag. It does NOT run on normal branch pushes, so nothing is
# published until a tag is explicitly created.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages (API 36)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared STASH web application
        run: pnpm build:web
      - name: Build native web bundle
        run: pnpm build:native-web
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Compile debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STASH-Android.apk
      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: STASH-Android.apk
          if-no-files-found: error

  windows:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo
          key: tauri-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared STASH web application
        run: pnpm build:web
      - name: Build native web bundle
        run: pnpm build:native-web
      - name: Build STASH with Tauri
        run: pnpm tauri:build
      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _artifacts | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "_artifacts/STASH-Windows-Setup.exe" }
          if (Test-Path "src-tauri/target/release/stash.exe") { Copy-Item "src-tauri/target/release/stash.exe" "_artifacts/STASH-Windows.exe" }
          Get-ChildItem "_artifacts" | Select-Object Name, Length
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: _artifacts/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/android/STASH-Android.apk
            artifacts/windows/*.exe
